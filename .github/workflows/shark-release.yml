name: Shark Release

on:
  push:
    tags:
      - "shark-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0 — the shark-v prefix is added automatically)"
        required: true
        type: string

env:
  # Default brand baked into CI builds. These live in the workflow, not in
  # the gitignored .env, so a pull request to change branding needs a
  # one-line update here too.
  BRAND_NAME: "Shark"
  BRAND_SHORT: "SK"
  BRAND_ORG: "SUJA"
  BRAND_ORG_WEBSITE: "https://sujahealthtech.com"
  BRAND_ORG_ABOUT: "SUJA is a software studio building AI-powered developer tools."

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#shark-v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "shark-v${{ steps.version.outputs.value }}" \
            --repo "${{ github.repository }}" \
            --generate-notes \
            --title "shark-v${{ steps.version.outputs.value }}" \
            --draft=false || true

      - name: Build all targets and upload release assets
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.value }}
          OPENCODE_CHANNEL: latest
          OPENCODE_RELEASE: "1"
          GH_REPO: ${{ github.repository }}
          GH_RELEASE_TAG: shark-v${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run build

      # Windows code signing — runs in-place only when credentials are
      # available; no-ops otherwise.  Requires no changes to build.ts.
      - name: Sign Windows binaries (best-effort)
        if: success()
        shell: pwsh
        working-directory: packages/opencode
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $targets = Get-ChildItem dist -Directory -Filter "shark-windows-*" | Where-Object { (Test-Path "$($_.FullName)/bin/shark.exe") }
          foreach ($t in $targets) {
            & "$env:GITHUB_WORKSPACE/script/sign-windows.ps1" "$($_.FullName)/bin/shark.exe"
          }
          Write-Host "Windows signing step complete (skipped if not configured)"